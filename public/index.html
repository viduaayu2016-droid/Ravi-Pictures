<script>
const content={about:['About Ravi Pictures','We take each assignment as a creative challenge, bringing together film, television, commercials, animation and corporate production to turn ideas into a compelling viewer experience.'],services:['Our services','Films, television, commercials, animation, corporate films and short films. Tell us about your vision and we will help you find the right format.'],clients:['Our clients','Visit the original Ravi Pictures client page to explore the studio’s client information.','https://ravipictures.com/'],images:['Image gallery','Explore the image gallery on the original Ravi Pictures website.','https://ravipictures.com/'],videos:['Films & showreel','Explore the video gallery on the original Ravi Pictures website.','https://ravipictures.com/video.html'],films:['Films','Feature films and independent cinema, built around compelling stories.'],television:['Television','Serials and shows crafted for television audiences.'],commercials:['Commercials','Brand films and advertising that bring your message to the screen.'],animation:['Animation','Creative animation content for films, brands and digital audiences.'],corporate:['Corporate films','Business stories that communicate your vision and inspire your audience.'],short:['Short films','Bold ideas and human stories in a focused format.']};const panel=document.getElementById('panel');document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{const c=content[b.dataset.panel];document.getElementById('title').textContent=c[0];document.getElementById('description').textContent=c[1];const a=document.getElementById('destination');a.href=c[2]||'mailto:info@ravipictures.com?subject=Project%20enquiry';a.textContent=c[2]?'Visit Ravi Pictures ↗':'Discuss your project ↗';panel.showModal()}));document.querySelector('.close').onclick=()=>panel.close();panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)panel.close()}});
